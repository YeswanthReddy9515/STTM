name: Excel to JSON PR Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'data/**/*.xlsx'
  workflow_dispatch:

jobs:
  convert-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Convert Excel to JSON
        run: python sttm_convert.py

      - name: Checkout poc_target and copy only JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save JSON to temp BEFORE switching branch
          cp -r output_json /tmp/output_json

          # Remove from current workspace so checkout doesn't fail
          rm -rf output_json

          # Checkout poc_target branch
          git checkout poc_target

          # Remove old JSON files
          rm -rf output_json

          # Copy only fresh JSON files
          cp -r /tmp/output_json ./output_json

          # Create new branch from poc_target
          BRANCH="auto/json-${{ github.run_id }}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          git add output_json/
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Auto-generated JSON from Excel"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base poc_target \
            --head "$BRANCH" \
            --title "Excel to JSON Auto PR" \
            --body $'Excel upload detected. JSON files were generated automatically.\n\nPlease review the generated JSON changes before merging.')

          echo "PR created: $PR_URL"

          gh pr merge "$PR_URL" --merge --delete-branch

          echo "PR merged and branch $BRANCH deleted ✅"
